name: phantominfo_ecommerce
description: PhantomInfo mobile starter
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: ">=2.18.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.2
  shared_preferences: ^2.1.0
  carousel_slider: ^4.2.0
  intl: ^0.18.0

dev_dependencies:
  flutter_test:
    sdk: flutter

flutter:
  uses-material-design: true
  assets:
    - assets/banners/
    - assets/produtos/
    - assets/logos/
    - assets/categorias/
    - assets/icones/

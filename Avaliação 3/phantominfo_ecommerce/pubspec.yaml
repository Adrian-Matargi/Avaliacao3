name: phantom_mobile
description: PhantomInfo mobile starter (generated)
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: ">=2.18.0 <3.0.0"

dependencies:
  flutter:
    sdk: flutter

  provider: ^6.1.1
  shared_preferences: ^2.1.0
  carousel_slider: 4.2.0
  intl: ^0.18.0
  http: ^1.2.0
  firebase_core: ^4.2.0 
  cloud_firestore: ^6.1.0 


  cupertino_icons: ^1.0.2

flutter:
  uses-material-design: true
  assets:
